/* Layout concept: same five-tab report as the Jul–Aug version. Pale blue-grey ground, white cards,
   one indigo brand accent, semantic band colors (A green, B blue, C slate, No Fit grey, No Score amber).
   Light only by choice, to match the report already shared with PMI. */
:root{
  color-scheme: light;
  --bg:#eef2f7; --surface:#ffffff; --ink:#0f1b2d; --ink2:#44536a; --muted:#76849a;
  --line:#e0e6ee; --line2:#edf1f6; --brand:#3f4fd0;
  --a:#2f9a5d; --b:#3b5bdb; --c:#7d8aa0; --nf:#b4bfce; --ns:#e0a21a;
  --pre:#a99af0; --ij:#ee8a17; --ul:#f1c94e; --ip:#d5dce7; --none:#e8ecf2; --purple:#6b5bd6;
  --warn-bg:#fff5d9; --warn-line:#efd68a; --warn-ink:#5b4606;
  --good-bg:#e8f6ed; --good-line:#a9dcb9; --good-ink:#17653a;
  --info-bg:#e9eefc; --info-line:#c3cff7; --info-ink:#27399a;
  --risk-bg:#fdecec; --risk-line:#f0bcbc; --risk-ink:#8f2626;
  --orange:#d9730d; --red:#c43a3a;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:12px;padding-block:16px 10px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.brandrow h1{margin:0;font-size:15px;font-weight:700;line-height:1.25}
.brandrow p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;font:500 12.5px var(--font);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
main{padding-block:22px 36px}
[hidden]{display:none!important}
.panel{display:flex;flex-direction:column;gap:16px}
/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.card h2{margin:0 0 3px;font-size:13px;font-weight:700}
.card .sub{margin:0 0 14px;font-size:11.5px;color:var(--ink2);max-width:80ch}
.chapter{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:6px;padding:14px 18px}
.chapter h2{margin:0 0 4px;font-size:13px;font-weight:700}
.chapter p{margin:0;font-size:12px;color:var(--ink2);max-width:90ch}
.note{border-radius:8px;padding:11px 14px;font-size:11.5px;line-height:1.55;border:1px solid}
.note p{margin:0}
.note p+p{margin-top:6px}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.note.good{background:var(--good-bg);border-color:var(--good-line);color:var(--good-ink)}
.note.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-ink)}
.note.risk{background:var(--risk-bg);border-color:var(--risk-line);color:var(--risk-ink)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.kpi .val{font-size:30px;font-weight:700;line-height:1.15;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi .desc{font-size:11.5px;color:var(--ink2);margin:0}
.kpi .foot{font-size:10.5px;color:var(--muted);font-style:italic;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line2)}
.cg{color:var(--a)}.cb{color:var(--b)}.co{color:var(--orange)}.cp{color:var(--purple)}.cr{color:var(--red)}
/* hero */
.hero{background:var(--good-bg);border:1px solid var(--good-line);border-radius:12px;padding:24px 26px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.hero .big{font-size:76px;font-weight:800;letter-spacing:-.02em;color:var(--a);line-height:1;font-variant-numeric:tabular-nums}
.hero h2{margin:0 0 6px;font-size:16px;font-weight:700}
.hero p{margin:0 0 12px;font-size:12.5px;color:var(--ink2);max-width:62ch}
.calc{background:rgba(47,154,93,.12);border:1px solid var(--good-line);border-radius:6px;padding:9px 12px;font-size:11.5px;color:var(--good-ink);display:flex;flex-direction:column;gap:3px}
.pill{display:inline-block;margin-top:12px;border:1px solid var(--good-line);background:#f4fbf6;color:var(--good-ink);border-radius:999px;padding:3px 11px;font-size:10.5px;font-weight:600}
@media (max-width:720px){.hero{grid-template-columns:1fr;gap:12px;padding:20px}.hero .big{font-size:60px}}
/* donut */
.donutrow{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:28px;align-items:center;justify-items:center}
.donutrow svg{width:100%;max-width:260px;height:auto}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;width:100%;max-width:440px}
.legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-size:12px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.legend .n{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:48px}
.legend .p{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:48px}
@media (max-width:720px){.donutrow{grid-template-columns:1fr}}
.explain{margin-top:16px;background:#f3f5fa;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:11.5px;color:var(--ink2);line-height:1.6}
.explain b{color:var(--ink)}
/* funnel */
.legrow{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--ink2);margin-bottom:6px}
.legrow span{display:inline-flex;align-items:center;gap:6px}
.legrow i{width:10px;height:10px;border-radius:2px;display:inline-block}
.fstage{display:grid;grid-template-columns:150px 1fr 130px;gap:16px;padding:16px 0;border-top:1px solid var(--line2);align-items:center}
.fstage .nm{text-align:right}
.fstage .nm b{display:block;font-size:12.5px}
.fstage .nm span{display:block;font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:3px;min-width:0}
.brow{display:flex;align-items:center;gap:7px;height:12px}
.brow .bar{height:9px;border-radius:2px;flex:none;min-width:3px}
.brow .lb{font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.fstage .pc{text-align:right}
.fstage .pc strong{display:block;font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.fstage .pc span{display:block;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){.fstage{grid-template-columns:1fr;gap:8px}.fstage .nm,.fstage .pc{text-align:left}.fstage .pc{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}}
/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.scroll.tall{max-height:560px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#f3f5fa;text-align:left;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.l{font-weight:600}
.chip{display:inline-block;min-width:1.7em;text-align:center;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600}
.chip.a{background:#dcf1e4;color:#1d6b40}.chip.b{background:#e0e7fb;color:#2a40a8}.chip.c{background:#eaeef4;color:#44536a}.chip.n{background:#eef1f5;color:#6b7a90}.chip.s{background:#fdeec5;color:#8a5a00}
.rate{display:flex;align-items:center;gap:10px;min-width:170px}
.rate .tr{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.rate .fl{display:block;height:100%;border-radius:3px}
.rate b{min-width:44px;text-align:right}
.tgt{display:inline-block;border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:600}
.tgt.ok{background:#dcf1e4;color:#1d6b40}.tgt.m{background:#fdeec5;color:#8a5a00}.tgt.h{background:#fde0c8;color:#9a4a07}.tgt.x{background:#eef1f5;color:#76849a}
.lown{font-size:9.5px;color:var(--muted);margin-left:6px;font-weight:500}
.hint{font-size:11px;color:var(--muted);margin:10px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:12px}
.seg button{appearance:none;border:0;background:var(--surface);padding:6px 12px;font:500 11.5px var(--font);color:var(--ink2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--info-bg);color:var(--info-ink);font-weight:600}
/* pipeline flow */
.mon{margin-top:14px}
.mon h3{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.frow{display:grid;grid-template-columns:160px 1fr 210px;gap:14px;align-items:center;padding:4px 0;font-size:11.5px}
.frow .tk{height:20px;background:var(--line2);border-radius:4px;position:relative;overflow:hidden}
.frow .fi{position:absolute;inset:0 auto 0 0;border-radius:4px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;min-width:max-content}
.frow .fi.out{color:var(--ink);padding-left:0;left:0;background:none!important}
.frow .ann{font-size:10.5px;color:var(--muted);text-align:right}
.frow .ann.g{color:var(--a);font-weight:600}.frow .ann.o{color:var(--orange);font-weight:600}

/* actions */
.item{border-radius:8px;border:1px solid var(--line);border-left:3px solid var(--a);background:var(--surface);padding:13px 16px}
.item h3{margin:0 0 4px;font-size:12.5px;font-weight:700}
.item p{margin:0;font-size:12px;color:var(--ink2);max-width:90ch}
.item.risk{border-left-color:var(--red);background:var(--risk-bg);border-color:var(--risk-line)}
.item.risk h3{color:var(--risk-ink)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font)}
footer{padding-block:6px 30px;font-size:10.5px;color:var(--muted)}
.sr{position:absolute;left:-9999px}
</style>

/* ---------- tab 1 ---------- */
function donutSvg(segs){
  const R = 70, C = 2 * Math.PI * R, total = sum(segs, s => s.n);
  let off = 0, out = '';
  segs.forEach(s => {
    const len = s.n / total * C;
    const gap = len > 4 ? 1.6 : 0;
    out += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${s.color}" stroke-width="30" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${s.label}: ${fmt(s.n)} (${p1(s.n/total*100)}%)</title></circle>`;
    off += len;
  });
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Donut chart of ${fmt(total)} hires by Fit Score status">${out}
    <text x="100" y="97" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${fmt(total)}</text>
    <text x="100" y="116" text-anchor="middle" font-size="10" fill="var(--muted)" letter-spacing="1">HIRES</text></svg>`;
}

function lineChart(){

  let grid = '';
  for (let v = ymin; v <= ymax; v += 10) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v}%</text>`;
  const line = pts.map((p,i) => `${i?'L':'M'}${x(i)},${y(p.v)}`).join(' ');

function rateCell(ab, n, withTag){
  if (!n) return `<span class="tgt x">n/a</span>`;
  const r = Number(p1(ab / n * 100));
  const col = r >= TARGET ? 'var(--a)' : r >= 70 ? 'var(--b)' : 'var(--orange)';
  return `<div class="rate"><span class="tr"><span class="fl" style="width:${Math.min(r,100)}%;background:${col}"></span></span><b>${p1(r)}%</b></div>`;
}
function vsCell(ab, n){
  if (!n) return `<span class="tgt x">n/a</span>`;
  const r = Number(p1(ab / n * 100)), d = r - TARGET;
  if (d >= 0) return `<span class="tgt ok">✓ At target</span>`;
  return `<span class="tgt ${d >= -5 ? 'm' : 'h'}">−${Math.abs(d).toFixed(1)}pp</span>`;
}
function bandRow(name, hired, a, b, c, nf, ns, lowN){
  const sc = a + b + c + nf;
  return `<tr><td class="l">${name}${lowN && sc < 20 ? '<span class="lown">low n</span>' : ''}</td><td>${fmt(hired)}</td>
    <td><span class="chip a">${a}</span></td><td><span class="chip b">${b}</span></td><td><span class="chip c">${c}</span></td><td><span class="chip n">${nf}</span></td><td><span class="chip s">${fmt(ns)}</span></td>
    <td>${fmt(sc)}</td><td>${rateCell(a + b, sc)}</td><td>${vsCell(a + b, sc)}</td></tr>`;
}
function consolidate(){
  const alias = {};
  Object.entries(D.countryAlias).forEach(([canon, list]) => list.forEach(l => alias[l] = canon));
  const m = new Map();
  D.countryRaw.forEach(([label, h, a, b, c, nf, ns]) => {
    const k = alias[label] || label;
    const cur = m.get(k) || [k, 0, 0, 0, 0, 0, 0];
    [h, a, b, c, nf, ns].forEach((v, i) => cur[i + 1] += v);
    m.set(k, cur);
  });
  return [...m.values()];
}
let countrySort = 'hires';
function countryRows(){
  const rows = consolidate();
  const known = rows.filter(r => r[0] !== 'Unknown');
  const unk = rows.filter(r => r[0] === 'Unknown');
  const rate = r => { const s = r[2]+r[3]+r[4]+r[5]; return s ? (r[2]+r[3]) / s : -1; };
  known.sort(countrySort === 'rate' ? (x, y) => rate(y) - rate(x) || y[1] - x[1] : (x, y) => y[1] - x[1]);
  return known.concat(unk).map(r => bandRow(r[0], r[1], r[2], r[3], r[4], r[5], r[6], true)).join('');
}

  <div class="note warn"><p><b>How A/B % is calculated:</b> A/B % = (A + B) ÷ (A + B + C + No Fit) per row. No Score is excluded from the denominator because the rate measures quality when Fit Score can score. "Total Hires" includes No Score. "low n" marks rows with fewer than 20 scored hires, where a single hire moves the rate noticeably. Categories with fewer than 10 hires are not shown. Salary Grade and Function filters are not available in this dashboard; use Report Builder for row-level filtering.</p></div>

    <div class="note info" style="margin-top:12px"><p><b>Key observations:</b> Several categories carry a large No Score share. Those hires are excluded from the A/B rate, so each rate reflects scored hires only. Tab 5 covers what drives No Score.</p></div>

  </section>`;

function stackChart(){
  const W = 640, Hh = 300, L = 58, R = 16, T = 28, B = 36, ymax = 18000;
  const y = v => T + (Hh - T - B) * (1 - v / ymax);
  let grid = '';
  for (let v = 0; v <= ymax; v += 3000) grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`;
  const slot = (W - L - R) / D.tafEvents.length, cw = 110;
  let cols = '';
  D.tafEvents.forEach((r, i) => {
    const x0 = L + slot * i + (slot - cw) / 2;
    let base = 0;
    [['acc','Accepted','var(--a)','#fff'],['dec','Declined','var(--ns)','var(--ink)'],['rej','Rejected','var(--nf)','var(--ink)']].forEach(([k, name, col, tc]) => {
      const v = r[k], yt = y(base + v), yb = y(base), h = yb - yt;
      cols += `<rect x="${x0}" y="${yt + 1}" width="${cw}" height="${Math.max(h - 2, 1)}" fill="${col}" rx="2"><title>${r.m} · ${name}: ${fmt(v)}</title></rect>`;
      if (h > 18) cols += `<text x="${x0 + cw/2}" y="${(yt + yb)/2 + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="${tc}">${fmt(v)}</text>`;
      base += v;
    });
    cols += `<text x="${x0 + cw/2}" y="${y(base) - 8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${fmt(base)}</text><text x="${x0 + cw/2}" y="${Hh - 14}" text-anchor="middle" font-size="11" fill="var(--ink2)">${r.m}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="TAF status events by month, stacked: accepted, declined, rejected">${grid}${cols}</svg>`;
}

function flowRows(i){
  const maxV = Math.max(...D.newApps);
  const sc = D.tafScored[i] / D.tafTotal[i] * 100;
  const defs = [
    ['New Applications', D.newApps[i], 'var(--b)', 'Candidates entering pipeline', ''],
    ['TAF Screened — Scored', D.tafScored[i], 'var(--a)', `${p1(sc)}% had Fit Score · thumbs possible`, 'g'],
    ['TAF Screened — No Score', D.tafTotal[i] - D.tafScored[i], 'var(--ns)', 'No Fit Score · thumbs not possible', 'o'],
    ['Thumbs Up', D.thumbsUp[i], 'var(--purple)', 'UI click events · all candidates', ''],
    ['Thumbs Down (vol. only)', D.thumbsDown[i], 'var(--c)', 'Candidate attribution unavailable · under investigation', '']
  ];
  return defs.map(([name, v, col, ann, ac]) => {
    const w = Math.max(v / maxV * 100, 0.6);
    const inside = w > 14;
    return `<div class="frow"><span>${name}</span><div class="tk"><div class="fi ${inside ? '' : 'out'}" style="width:${inside ? w : 0}%;background:${inside ? col : 'none'}">${inside ? fmt(v) : ''}</div>${inside ? '' : `<div class="fi out" style="left:calc(${w}% + 6px)"><span style="display:inline-block;width:${w}%;"></span>${fmt(v)}</div>`}</div><span class="ann ${ac}">${ann}</span></div>`;
  }).join('');
}
// Small bars: draw the colored stub plus label (kept separate so tiny widths stay visible)
function flowRowsFixed(i){
  const maxV = Math.max(...D.newApps);
  const sc = D.tafScored[i] / D.tafTotal[i] * 100;
  const defs = [
    ['New Applications', D.newApps[i], 'var(--b)', 'Candidates entering pipeline', ''],
    ['TAF Screened — Scored', D.tafScored[i], 'var(--a)', `${p1(sc)}% had Fit Score · thumbs possible`, 'g'],
    ['TAF Screened — No Score', D.tafTotal[i] - D.tafScored[i], 'var(--ns)', 'No Fit Score · thumbs not possible', 'o'],
    ['Thumbs Up', D.thumbsUp[i], 'var(--purple)', 'UI click events · all candidates', ''],
    ['Thumbs Down (vol. only)', D.thumbsDown[i], 'var(--c)', 'Candidate attribution unavailable · under investigation', '']
  ];
  return defs.map(([name, v, col, ann, ac]) => {
    const w = Math.max(v / maxV * 100, 0.8);
    const inside = w > 15;
    const label = `<span style="font-size:11px;font-weight:600;color:${inside ? '#fff' : 'var(--ink)'};padding:0 8px;white-space:nowrap">${fmt(v)}</span>`;
    return `<div class="frow"><span>${name}</span>
      <div class="tk" style="overflow:visible;background:var(--line2)"><div style="height:20px;width:${w}%;background:${col};border-radius:4px;display:flex;align-items:center;position:relative">${inside ? label : ''}${inside ? '' : `<span style="position:absolute;left:calc(100% + 6px);font-size:11px;font-weight:600;white-space:nowrap">${fmt(v)}</span>`}</div></div>
      <span class="ann ${ac}">${ann}</span></div>`;
  }).join('');
}

function tab4(){
  const totNew = sum(D.newApps, v => v), totTaf = sum(D.tafTotal, v => v), totSc = sum(D.tafScored, v => v);
  const peakI = D.tafScored.map((s, i) => s / D.tafTotal[i]).reduce((bi, v, i, a) => v > a[bi] ? i : bi, 0);
  const peak = D.tafScored[peakI] / D.tafTotal[peakI] * 100;
  const mName = { Jul:'July', Aug:'August', Sep:'September' };
  const fbScored = sum(D.recruiters, r => r[2]), fbThumbs = sum(D.recruiters, r => r[4]);
  const rows = D.recruiters.map(r => {
    const [em, mv, s, u, t] = r;
    const sp = s / mv * 100, fr = s ? t / s * 100 : null;
    const spCol = sp >= 90 ? 'var(--a)' : sp >= 75 ? 'var(--b)' : 'var(--orange)';
    const frCol = fr === null ? 'var(--line2)' : fr >= 75 ? 'var(--a)' : fr >= 55 ? 'var(--b)' : 'var(--orange)';
    const frTxt = fr === null ? `<span class="tgt x">—</span>` : fr === 0 ? `<div class="rate"><span class="tr"></span><b class="cr">0.0%</b></div>` : `<div class="rate"><span class="tr"><span class="fl" style="width:${fr}%;background:${frCol}"></span></span><b>${p1(fr)}%</b></div>`;
    return `<tr><td class="l">${em}</td><td>${fmt(mv)}</td><td style="color:var(--a);font-weight:600">${fmt(s)}</td><td style="color:var(--orange);font-weight:600">${fmt(u)}</td>
      <td><div class="rate" style="min-width:130px"><span class="tr"><span class="fl" style="width:${sp}%;background:${spCol}"></span></span><b>${p1(sp)}%</b></div></td>
      <td style="color:var(--purple);font-weight:600">${fmt(t)}</td><td>${frTxt}</td></tr>`;
  }).join('');
  return `
  <div class="chapter"><h2>Chapter 4 — Recruiter adoption and TAF screening activity · Jul – Sep 2026</h2>
    <p>Monthly pipeline flow, TAF screening coverage, and per-recruiter Fit Score feedback analysis. All figures cover Jul – Sep 2026.</p></div>
  <div class="note warn"><p><b>Data sources:</b> TAF screening counts from RB_APPLICATIONS_DETAILS (monthly) and RB_RECRUITER_ACTIVITY (per recruiter). Thumbs up and down from FACT_CRM_OVERALL_ACTIONS (UI event log; counts clicks, not unique decisions). <b>Important:</b> thumbs-down events have NULL Candidate ID and Job ID in the database, a confirmed data instrumentation gap under investigation by engineering. Thumbs-down volume is shown but cannot be attributed to specific candidates.</p></div>
  <div class="grid g4">
    <div class="card kpi"><div class="lab">Total new applications</div><div class="val cb">${fmt(totNew)}</div><p class="desc">Candidate-job pairs entering New Application status, summed by month · Jul – Sep 2026</p></div>
    <div class="card kpi"><div class="lab">Total TAF screened</div><div class="val cg">${fmt(totTaf)}</div><p class="desc">Moved to any TAF step, summed by month · % with Fit Score shown in chart below</p></div>
    <div class="card kpi"><div class="lab">Peak scored % at TAF</div><div class="val co">${p1(peak)}%</div><p class="desc">Best month for Fit Score coverage at TAF screening (${mName[D.months[peakI]]} 2026)</p></div>
    <div class="card kpi"><div class="lab">Feedback rate, top 30</div><div class="val cp">${p1(fbThumbs / fbScored * 100)}%</div><p class="desc">% of scored TAF candidates who received thumbs-up feedback from their own screener (top 30 recruiters)</p></div>
  </div>
  <section class="card" aria-labelledby="p-h"><h2 id="p-h">Monthly Pipeline Flow — Jul – Sep 2026</h2>
    <p class="sub">Five bars per month: New Applications entering the pipeline, TAF Screened with a Fit Score (thumbs possible), TAF Screened without one (thumbs not possible), Thumbs Up, and Thumbs Down (volume only, candidate attribution unavailable). All bars share one scale.</p>
    ${D.months.map((m, i) => `<div class="mon"><h3>${m} 2026</h3>${flowRowsFixed(i)}</div>`).join('')}
    <div class="note good" style="margin-top:14px"><p><b>TAF coverage:</b> ${D.months.map((m, i) => `${p1(D.tafScored[i]/D.tafTotal[i]*100)}% of TAF-screened candidates had a Fit Score in ${mName[m]}`).join(', ').replace(/, ([^,]*)$/, ' and $1')} (${p1(totSc/totTaf*100)}% across the quarter).</p></div>
  </section>
  <section class="card chart" aria-labelledby="t-h"><h2 id="t-h">TAF Screening Step Breakdown — Jul – Sep 2026</h2>
    <p class="sub">Three confirmed TAF statuses per Jakub's July 15 mapping. Event-level counts from RB_APPLICATIONS_DETAILS, not distinct candidate-job pairs.</p>
    <div class="legrow"><span><i style="background:var(--a)"></i>TAF Accepted</span><span><i style="background:var(--ns)"></i>TAF Declined</span><span><i style="background:var(--nf)"></i>TAF Rejected</span></div>
    ${stackChart()}
  </section>
  <section class="card" aria-labelledby="r-h"><h2 id="r-h">Top 30 Recruiters — TAF Activity · Fit Score Feedback on Own Screened Candidates · Jul – Sep 2026</h2>
    <p class="sub">TAF Moves = unique candidate-job pairs moved to any TAF status. Scored TAF = those with a valid Fit Score. Thumbs-up on own TAF = times this recruiter gave a thumbs-up on a scored candidate they personally screened (strict match: same recruiter, same candidate, same job). Feedback Rate = thumbs-up on own TAF ÷ Scored TAF.</p>
    <div class="scroll tall"><table style="min-width:820px"><thead><tr><th>Recruiter email</th><th>TAF moves</th><th>Scored TAF</th><th>Unscored TAF</th><th>Scored %</th><th>Thumbs-up on own TAF</th><th>Feedback rate</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note info" style="margin-top:12px"><p><b>How to read Feedback Rate:</b> a high rate means the recruiter regularly gives feedback on Fit Score for candidates they screen. A rate of 0% means no thumbs-up was recorded for that recruiter; it can reflect recruiter behavior or how feedback is captured. Thumbs-down is not part of this strict match because of the instrumentation gap above, which is under engineering investigation.</p></div>
  </section>`;
}

/* ---------- tab 5 ---------- */
function tab5(){
  const R = [
    ['Incomplete Job', H.ij, 'Blank matching criteria, most likely child requisitions', '<span style="color:var(--orange);font-weight:600">▲ Child requisition linkage under investigation</span>'],
    ['Unsupported Language', H.ul, 'Job or CV language outside scoring coverage', `<span style="color:var(--a);font-weight:600">✓ Gen 3 covers 17 languages</span> · ${D.ulByMonth.Jul} hires in July, ${D.ulByMonth.Aug} in August, ${D.ulByMonth.Sep} in September`],
    ['Incomplete Profile', H.ip, 'Candidate profile missing data for scoring', 'Recruiter can prompt candidate to complete profile'],
    ['Scored before Jul 1', H.pre, 'Latest score generated before the reporting window and not refreshed in it', `Counted as No Score in this report. ${fmt(preScored)} carry an A, B, C or No Fit band on file (${fmt(preAB)} A or B); ${fmt(preUnscored)} carry an Incomplete or Unsupported Language status`],
    ['No score on file', H.none, 'No score record found for this candidate-job pair', 'Under review']
  ];
  const rows = R.map(r => `<tr><td class="l" style="white-space:normal">${r[0]}</td><td>${fmt(r[1])}</td><td>${p1(r[1]/H.total*100)}%</td><td style="white-space:normal;min-width:220px">${r[2]}</td><td style="white-space:normal;min-width:260px">${r[3]}</td></tr>`).join('')
    + `<tr style="background:#f7f9fc"><td class="l">All no-score hires</td><td><b>${fmt(unscored)}</b></td><td><b>${p1(unscored/H.total*100)}%</b></td><td colspan="2"></td></tr>`;
  return `
  <div class="chapter"><h2>Chapter 5 — Path to 80% and unresolved gaps · Jul – Sep 2026</h2>
    <p>PMI's target is 80% of hires from A or B candidates. The current scored hire rate is ${p1(abRate)}%, a gap of ${gapPP.toFixed(1)} percentage points. This tab explains the two actions that address the gap and the open question on child requisitions.</p></div>
  <div class="grid g3">
    <div class="card kpi"><div class="lab">Current A/B hire rate (scored)</div><div class="val cg">${p1(abRate)}%</div><p class="desc">${fmt(abCount)} A or B hires ÷ ${fmt(scored)} scored hires · Jul – Sep 2026 · Hired status only</p></div>
    <div class="card kpi"><div class="lab">PMI target</div><div class="val co">${TARGET}%</div><p class="desc">of all hires to come from A or B candidates · enabling 10% CLE headcount savings</p></div>
    <div class="card kpi"><div class="lab">Gap to close</div><div class="val cr">${gapPP.toFixed(1)}pp</div><p class="desc">Closeable through: reducing No Score at hire and completing job matching criteria</p></div>
  </div>
  <section class="card" aria-labelledby="n-h"><h2 id="n-h">No Score Breakdown at Hired Stage — Jul – Sep 2026</h2>
    <p class="sub">Of ${fmt(H.total)} total hires in Jul – Sep 2026, ${fmt(unscored)} (${p1(unscored/H.total*100)}%) had no score in the window. Breakdown by reason:</p>
    <div class="scroll"><table><thead><tr><th>Reason</th><th>Hired count</th><th>% of all hires</th><th>Root cause</th><th>Resolution</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Sensitivity: counting the ${fmt(H.pre)} earlier-scored hires, ${fmt(sensAB)} of ${fmt(sensScored)} scored hires are A or B (${p1(sensAB/sensScored*100)}%), against ${p1(abRate)}% as reported. ${fmt(256)} of the ${fmt(H.pre)} were July hires.</p>
  </section>
  <div class="item risk"><h3>▲ Open item: Child requisition Fit Score linkage</h3><p>PMI uses a parent/child requisition structure. Child requisitions have blank matching criteria by design, which triggers "Incomplete Job" score status. Currently these hires are counted without a Fit Score. A mechanism to match candidate ID across parent and child requisitions is under engineering investigation, with no confirmed timeline. The A/B rate shown covers scored hires only.</p></div>
  <div class="item"><h3>Action 1 — Gen 3 language coverage</h3><p>Gen 3 has been active for PMI since July 1, 2026 and covers 17 languages with cross-lingual scoring. Hires with an Unsupported Language status fell from ${D.ulByMonth.Jul} in July to ${D.ulByMonth.Sep} in September. No action is required from PMI.</p></div>
  <div class="item"><h3>Action 2 — Complete job matching criteria before posting</h3><p>Incomplete Job is the largest no-score group (${fmt(H.ij)} hires, ${p1(H.ij/H.total*100)}% of all hires). Short-term action: make sure requisitions have complete matching criteria set before posting. This is the highest-leverage action available to raise the share of hires with a Fit Score.</p></div>
  <div class="note warn"><p><b>Dashboard limitations:</b> Dynamic filtering by Country, Salary Grade, and Function is not supported in this dashboard. For row-level recruiter data, individual candidate scores, or filtering by date sub-range, the Report Builder export (configured with Leon) is the right tool.</p></div>`;
}

/* ---------- shell ---------- */
const TABS = [
  ['hiring','1. Hiring Outcomes',tab1],
  ['funnel','2. Funnel Signal',tab2],
  ['category','3. By Job Category',tab3],
  ['recruiters','4. Recruiter Adoption',tab4],
  ['path','5. Path to 80%',tab5]
];
const tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels');
TABS.forEach(([id, label, fn]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.role = 'tab'; b.id = 'tab-' + id; b.textContent = label;
  b.setAttribute('aria-controls', 'panel-' + id);
  b.addEventListener('click', () => show(id));
  tabsEl.appendChild(b);
  const p = document.createElement('section');
  p.className = 'panel'; p.id = 'panel-' + id; p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', 'tab-' + id);
  p.innerHTML = fn();
  panelsEl.appendChild(p);
});
function show(id, noHash){
  TABS.forEach(([t]) => {
    const on = t === id;
    const b = document.getElementById('tab-' + t);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
    document.getElementById('panel-' + t).hidden = !on;
    if (on) b.scrollIntoView({ block:'nearest', inline:'nearest' });
  });
  if (!noHash) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  window.scrollTo(0, 0);
}
tabsEl.addEventListener('keydown', e => {
  const ids = TABS.map(t => t[0]);
  const cur = ids.findIndex(t => document.getElementById('tab-' + t).getAttribute('aria-selected') === 'true');
  let n = null;
  if (e.key === 'ArrowRight') n = (cur + 1) % ids.length;
  if (e.key === 'ArrowLeft') n = (cur + ids.length - 1) % ids.length;
  if (n !== null) { show(ids[n]); document.getElementById('tab-' + ids[n]).focus(); e.preventDefault(); }
});
function setSort(mode){
  countrySort = mode;
  document.getElementById('country-body').innerHTML = countryRows();
  document.getElementById('s-hires').setAttribute('aria-pressed', mode === 'hires');
  document.getElementById('s-rate').setAttribute('aria-pressed', mode === 'rate');
}
document.getElementById('s-hires').addEventListener('click', () => setSort('hires'));
document.getElementById('s-rate').addEventListener('click', () => setSort('rate'));
const start = (location.hash || '').replace('#', '');
show(TABS.some(t => t[0] === start) ? start : 'hiring', true);
window.scrollTo(0, 0);
</script>
